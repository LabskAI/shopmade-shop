name: tests

on:
  push:
    branches: [main]
  pull_request:

# The package runs inside a Shopmade core install. Core and the packages it needs are public, so no token is needed.
jobs:
  pest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, zip, bcmath, gd, exif
          coverage: none

      - name: Syntax check
        run: find package/src package/config package/database package/routes package/tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - uses: actions/checkout@v4
        with:
          repository: LabskAI/shopmade-core
          ref: ${{ vars.SHOPMADE_CORE_REF || 'main' }}
          path: core

      - name: Install core with this package
        working-directory: core
        run: |
          composer config repositories.package '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require "labskai/shopmade-shop:*@dev" --no-interaction --no-progress
          cp .env.example .env && php artisan key:generate

      - name: Package tests
        working-directory: core
        run: vendor/bin/pest vendor/labskai/shopmade-shop/tests

      - name: Core tests with the package installed
        working-directory: core
        run: php artisan test --compact

      - name: Style
        working-directory: core
        run: vendor/bin/pint --test ../package
